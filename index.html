<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi pagina web</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&display=swap" rel="stylesheet">

    <style>

        body {
            font-family: 'Space Grotesk', sans-serif;
            background-color: #0f0f10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        main {
            width: 100%;
            max-width: 520px;
            background-color: #161618;
            border: 2px solid #ffffff;
            border-radius: 12px;
            padding: 32px;
            box-shadow: 6px 6px 0px #e10600; 
        }

        h1 {
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: -1px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        p {
            color: #aaaaaa;
            font-size: 0.95rem;
            line-height: 1.4;
            margin-bottom: 28px;
        }

        h2 {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #666666;
            margin-bottom: 14px;
        }

        ul {
            list-style: none;
            margin-bottom: 28px;
        }

        li {
            margin-bottom: 12px;
        }

        a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 18px;
            background-color: #0f0f10;
            border: 1.5px solid #333333;
            border-radius: 8px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 700;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        a:hover {
            border-color: #ffffff;
            background-color: #ffffff;
            color: #000000;
            transform: translate(-3px, -3px);
            box-shadow: 4px 4px 0px #e10600;
        }

        footer {
            margin-top: 24px;
            font-size: 0.75rem;
            color: #555555;
            text-align: center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

    <main>
        <h1>Desarrollo Web</h1>
        <p>Bienvenido. Índice central para acceder de forma rápida a todas las prácticas y entregas de la materia.</p>

        <ul>
            <li>
                <a href="Unidad-1/Puntuacion-1/index.html">

            </li>

                </a>

        </ul>

    </main>

    <footer>
        CRUZ MEJÍA — 2026
    </footer>

</body>

</html>
